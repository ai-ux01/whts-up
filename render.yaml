# Free-tier deploy: https://render.com/docs/free
# 1. Create Neon Postgres → paste DATABASE_URL in Render dashboard
# 2. Connect this repo → Render reads render.yaml → set remaining env vars (see docs/DEPLOY-FREE.md)

services:
  - type: web
    name: whats-up-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: OLLAMA_MODE
        value: off
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Set these ONCE (openssl rand -base64 32) and keep them stable. If they
      # change, ALL existing access/refresh tokens are invalidated → every user
      # gets 401 until they log in again. Managed manually (sync:false) so a
      # redeploy never silently rotates them.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: API_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_WEBHOOK_BASE_URL
        sync: false
      # --- WhatsApp (Meta Cloud API) ---
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      # Leave WHATSAPP_SANDBOX_MODE OFF in production so real sends are attempted.
      - key: WHATSAPP_SANDBOX_MODE
        value: "false"
      # Template used by the Settings "test WhatsApp" button.
      - key: WHATSAPP_TEST_TEMPLATE
        value: hello_world
      # --- Meta / Google OAuth ---
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # --- AI ---
      - key: OPENAI_API_KEY
        sync: false
      # --- Reel render pipeline (TTS) ---
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_DEFAULT_VOICE_ID
        sync: false
      # --- SMS provider (optional; mock if unset) ---
      - key: SMS_PROVIDER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      # --- Email provider (optional; mock if unset) ---
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      # --- Media storage (Supabase) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: growth-media
      # --- Crypto / queue ---
      # IMPORTANT: set ENCRYPTION_KEY ONCE (openssl rand -base64 32) and never rotate
      # casually — changing it makes all previously encrypted DB tokens undecryptable.
      # Managed manually (sync:false) rather than generated, so redeploys keep it stable.
      - key: ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: REDIS_URL
        sync: false
